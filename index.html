<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube to MP3 Converter</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 1rem;
            box-sizing: border-box;
        }
        .card {
            background: #1e293b;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 480px;
        }
        h2 {
            margin-top: 0;
            color: #38bdf8;
            text-align: center;
        }
        input {
            width: 100%;
            padding: 0.75rem;
            border-radius: 6px;
            border: 1px solid #475569;
            background: #0f172a;
            color: white;
            margin-bottom: 1rem;
            box-sizing: border-box;
            font-size: 0.95rem;
        }
        button {
            width: 100%;
            padding: 0.75rem;
            background: #0284c7;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: #0369a1;
        }
        button:disabled {
            background: #475569;
            cursor: not-allowed;
        }
        #status {
            margin-top: 1rem;
            text-align: center;
            font-size: 0.9rem;
            color: #94a3b8;
        }
        .track-info {
            margin-top: 1.2rem;
            background: #0f172a;
            padding: 1rem;
            border-radius: 8px;
            border: 1px solid #334155;
        }
        .track-title {
            font-weight: bold;
            color: #f8fafc;
            margin-bottom: 0.4rem;
            font-size: 0.95rem;
        }
        .track-meta {
            font-size: 0.8rem;
            color: #94a3b8;
            margin-bottom: 1rem;
        }
        .download-link {
            display: block;
            padding: 0.75rem;
            background: #16a34a;
            color: white;
            text-align: center;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            transition: background 0.2s;
        }
        .download-link:hover {
            background: #15803d;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>YouTube to MP3</h2>
        <input type="text" id="urlInput" placeholder="Pega el enlace de YouTube aquí...">
        <button id="downloadBtn" onclick="startConversion()">Convertir a MP3</button>
        <div id="status"></div>
        <div id="resultContainer"></div>
    </div>

    <script>
        const API_URL = "https://yttomp3-hhdd.onrender.com";

        async function startConversion() {
            const urlInput = document.getElementById('urlInput').value.trim();
            const btn = document.getElementById('downloadBtn');
            const status = document.getElementById('status');
            const resultContainer = document.getElementById('resultContainer');

            resultContainer.innerHTML = "";

            if (!urlInput) {
                status.textContent = "Por favor, introduce una URL de YouTube válida.";
                status.style.color = "#f87171";
                return;
            }

            btn.disabled = true;
            status.textContent = "Procesando audio...";
            status.style.color = "#38bdf8";

            try {
                let data = null;

                // Si la canción se está convirtiendo ("processing"), consulta cada 3 segundos
                for (let intento = 0; intento < 6; intento++) {
                    const response = await fetch(`${API_URL}/convert/?id_or_url=${encodeURIComponent(urlInput)}`);
                    data = await response.json();

                    if (!response.ok) {
                        throw new Error(data.detail || "Error al conectar con el backend.");
                    }

                    if (data.status === "processing") {
                        status.textContent = `Convirtiendo (${data.progress || 0}%)...`;
                        await new Promise(r => setTimeout(r, 3000));
                    } else {
                        break;
                    }
                }

                if (data && data.status === "ok" && data.link) {
                    status.textContent = "¡Conversión completada!";
                    status.style.color = "#4ade80";

                    const sizeMB = data.filesize ? (data.filesize / (1024 * 1024)).toFixed(2) + " MB" : "";
                    const durationMin = data.duration ? Math.floor(data.duration / 60) + ":" + String(Math.floor(data.duration % 60)).padStart(2, '0') + " min" : "";

                    resultContainer.innerHTML = `
                        <div class="track-info">
                            <div class="track-title">${data.title || "Audio MP3"}</div>
                            <div class="track-meta">${durationMin} ${sizeMB ? "• " + sizeMB : ""}</div>
                            <a href="${data.link}" class="download-link" target="_blank" rel="noopener noreferrer">
                                Descargar MP3
                            </a>
                        </div>
                    `;
                } else {
                    throw new Error(data.msg || "No se pudo obtener el enlace MP3.");
                }

            } catch (err) {
                status.textContent = `Error: ${err.message}`;
                status.style.color = "#f87171";
            } finally {
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
