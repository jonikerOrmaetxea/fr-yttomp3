<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor Audio MP3</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 1rem;
            box-sizing: border-box;
        }
        .card {
            background: #1e293b;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 480px;
        }
        h2 {
            margin-top: 0;
            color: #38bdf8;
            text-align: center;
        }
        input {
            width: 100%;
            padding: 0.75rem;
            border-radius: 6px;
            border: 1px solid #475569;
            background: #0f172a;
            color: white;
            margin-bottom: 1rem;
            box-sizing: border-box;
            font-size: 0.95rem;
        }
        button {
            width: 100%;
            padding: 0.75rem;
            background: #0284c7;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: #0369a1;
        }
        button:disabled {
            background: #475569;
            cursor: not-allowed;
        }
        #status {
            margin-top: 1rem;
            text-align: center;
            font-size: 0.9rem;
            color: #94a3b8;
            word-break: break-word;
        }
        .download-link {
            display: block;
            margin-top: 1rem;
            padding: 0.75rem;
            background: #16a34a;
            color: white;
            text-align: center;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
        }
        .download-link:hover {
            background: #15803d;
        }
        pre {
            background: #0f172a;
            padding: 0.75rem;
            border-radius: 6px;
            font-size: 0.75rem;
            overflow-x: auto;
            color: #cbd5e1;
            margin-top: 1rem;
            display: none;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Audio Converter</h2>
        <input type="text" id="urlInput" placeholder="Pega el enlace aquí...">
        <button id="downloadBtn" onclick="startConversion()">Convertir a MP3</button>
        <div id="status"></div>
        <div id="resultContainer"></div>
        <pre id="debugOutput"></pre>
    </div>

    <script>
        const API_URL = "https://yttomp3-hhdd.onrender.com";

        async function startConversion() {
            const urlInput = document.getElementById('urlInput').value.trim();
            const btn = document.getElementById('downloadBtn');
            const status = document.getElementById('status');
            const resultContainer = document.getElementById('resultContainer');
            const debugOutput = document.getElementById('debugOutput');

            resultContainer.innerHTML = "";
            debugOutput.style.display = "none";

            if (!urlInput) {
                status.textContent = "Por favor, introduce una URL válida.";
                status.style.color = "#f87171";
                return;
            }

            btn.disabled = true;
            status.textContent = "Consultando servidor... (Puede tardar unos 40s si Render estaba en reposo)";
            status.style.color = "#38bdf8";

            try {
                const response = await fetch(`${API_URL}/convert/?id_or_url=${encodeURIComponent(urlInput)}`);
                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.detail || "Error al procesar la solicitud en el servidor.");
                }

                // Buscamos los nombres de campo más habituales en las APIs de RapidAPI
                const mp3Url = data.downloadUrl || data.link || data.url || data.download_url;
                if (mp3Url) {
                    status.textContent = "¡Conversión lista!";
                    status.style.color = "#4ade80";

                    const linkElement = document.createElement('a');
                    linkElement.href = mp3Url;
                    linkElement.className = "download-link";
                    linkElement.target = "_blank";
                    linkElement.rel = "noopener noreferrer";
                    linkElement.textContent = "Descargar MP3 (" + (data.title || "Audio") + ")";
                    resultContainer.appendChild(linkElement);
                } else {
                    status.textContent = "Respuesta recibida (revisa la estructura JSON debajo):";
                    status.style.color = "#facc15";
                    debugOutput.textContent = JSON.stringify(data, null, 2);
                    debugOutput.style.display = "block";
                }

            } catch (err) {
                status.textContent = `Error: ${err.message}`;
                status.style.color = "#f87171";
            } finally {
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
