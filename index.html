<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YT to MP3 Converter</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #1e293b; padding: 2rem; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); width: 100%; max-width: 450px; }
        h2 { margin-top: 0; color: #38bdf8; text-align: center; }
        input { width: 100%; padding: 0.75rem; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: white; margin-bottom: 1rem; box-sizing: border-box; }
        button { width: 100%; padding: 0.75rem; background: #0284c7; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        button:hover { background: #0369a1; }
        button:disabled { background: #475569; cursor: not-allowed; }
        #status { margin-top: 1rem; text-align: center; font-size: 0.9rem; color: #94a3b8; }
    </style>
</head>
<body>

    <div class="card">
        <h2>YouTube to MP3</h2>
        <input type="text" id="urlInput" placeholder="Pega el enlace de YouTube aquí...">
        <button id="downloadBtn" onclick="startDownload()">Convertir a MP3</button>
        <div id="status"></div>
    </div>

    <script>
        // Tu backend en Render
        const API_URL = "https://yttomp3-hhdd.onrender.com";

        async function startDownload() {
            const urlInput = document.getElementById('urlInput').value.trim();
            const btn = document.getElementById('downloadBtn');
            const status = document.getElementById('status');

            if (!urlInput) {
                status.textContent = "Por favor, introduce una URL válida.";
                status.style.color = "#f87171";
                return;
            }

            btn.disabled = true;
            status.textContent = "Procesando audio... (Si el servidor estaba inactivo, esto puede tardar hasta 40 segundos)";
            status.style.color = "#38bdf8";

            try {
                // Hacemos la petición a tu endpoint /download/
                const response = await fetch(`${API_URL}/download/?url=${encodeURIComponent(urlInput)}`);

                if (!response.ok) {
                    const errData = await response.json();
                    throw new Error(errData.detail || "Error al procesar la solicitud.");
                }

                // Convertimos la respuesta en un blob de audio para forzar la descarga
                const blob = await response.blob();
                
                // Intentamos extraer el nombre del archivo del header o usamos uno por defecto
                const disposition = response.headers.get('content-disposition');
                let filename = "audio.mp3";
                if (disposition && disposition.includes('filename=')) {
                    filename = disposition.split('filename=')[1].replace(/["']/g, '');
                }

                const downloadUrl = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = downloadUrl;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                a.remove();
                window.URL.revokeObjectURL(downloadUrl);

                status.textContent = "¡Descarga completada con éxito!";
                status.style.color = "#4ade80";
            } catch (err) {
                status.textContent = `Error: ${err.message}`;
                status.style.color = "#f87171";
            } finally {
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
