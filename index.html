<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube to MP3 + BPM, Key & Chords</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 1rem;
            box-sizing: border-box;
        }
        .card {
            background: #1e293b;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 500px;
        }
        h2 {
            margin-top: 0;
            color: #38bdf8;
            text-align: center;
        }
        input {
            width: 100%;
            padding: 0.75rem;
            border-radius: 6px;
            border: 1px solid #475569;
            background: #0f172a;
            color: white;
            margin-bottom: 1rem;
            box-sizing: border-box;
            font-size: 0.95rem;
        }
        button {
            width: 100%;
            padding: 0.75rem;
            background: #0284c7;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: #0369a1;
        }
        button:disabled {
            background: #475569;
            cursor: not-allowed;
        }
        #status {
            margin-top: 1rem;
            text-align: center;
            font-size: 0.9rem;
            color: #94a3b8;
        }
        .track-info {
            margin-top: 1.2rem;
            background: #0f172a;
            padding: 1.2rem;
            border-radius: 8px;
            border: 1px solid #334155;
        }
        .track-title {
            font-weight: bold;
            color: #f8fafc;
            margin-bottom: 0.4rem;
            font-size: 0.95rem;
        }
        .track-meta {
            font-size: 0.8rem;
            color: #94a3b8;
            margin-bottom: 0.8rem;
        }
        .badges {
            display: flex;
            gap: 0.6rem;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }
        .badge {
            background: #1e293b;
            border: 1px solid #38bdf8;
            color: #38bdf8;
            padding: 0.35rem 0.7rem;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
        }
        .badge.key-badge {
            border-color: #a855f7;
            color: #c084fc;
        }
        .chords-box {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 6px;
            padding: 0.85rem;
            margin-bottom: 1rem;
        }
        .chords-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #94a3b8;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }
        .chords-grid {
            display: flex;
            gap: 0.4rem;
            flex-wrap: wrap;
            margin-bottom: 0.75rem;
        }
        .chord-pill {
            background: #0f172a;
            border: 1px solid #475569;
            color: #e2e8f0;
            padding: 0.3rem 0.55rem;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: bold;
            font-family: monospace;
        }
        .chord-pill.root {
            border-color: #c084fc;
            color: #e9d5ff;
            background: #2e1065;
        }
        .progression-text {
            font-size: 0.82rem;
            color: #cbd5e1;
            border-top: 1px solid #334155;
            padding-top: 0.5rem;
        }
        .progression-text strong {
            color: #38bdf8;
        }
        .download-link {
            display: block;
            padding: 0.75rem;
            background: #16a34a;
            color: white;
            text-align: center;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            transition: background 0.2s;
        }
        .download-link:hover {
            background: #15803d;
        }
    </style>
</head>
<body>

        <h2>YouTube to MP3 & Harmony</h2>
        <input type="text" id="urlInput" placeholder="Pega el enlace de YouTube aquí...">
        <button id="downloadBtn" onclick="startConversion()">Convertir y Analizar</button>
        <div id="status"></div>
        <div id="resultContainer"></div>
    </div>
